# Build APK lewat GitHub Actions
name: Build Android

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Baca build.env
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ""|\#*) continue ;;
            esac
            [[ "$line" == *=* ]] || continue
            key="${line%%=*}"
            value="${line#*=}"
            key="${key// /}"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < build.env

      - name: Pasang logo
        run: cp "$LOGO" app/src/main/res/drawable/logo.png

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Kumpulkan file
        run: |
          mkdir -p package
          cp app/build/outputs/apk/debug/app-debug.apk "package/${APP_NAME// /_}.apk"

      # Nama artifact diambil dari ARTIFACT_NAME di build.env
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: package/
